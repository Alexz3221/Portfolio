<!doctype html><html><head><meta charset="utf-8"><title>City UI smoke test</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portfolio.css"></head><body>
<canvas id="drive-scene" tabindex="0"></canvas><div class="route-picker"></div><pre id="results"></pre>
<script src="../js/city.js"></script><script src="../js/portfolio-ui.js"></script>
<script>
const failures = [];
function check(condition, label) { if (!condition) failures.push(label); }
const stops = DriveCity.stops;
let jumped = null, opens = 0, closes = 0;
const ui = DrivePortfolioUI.create({document, window, stops, driveTarget:document.querySelector('#drive-scene'),
  onJump(stop) { jumped = stop.id; }, onOpen() { opens++; }, onClose() { closes++; }});
ui.setMap('city');
ui.update({x: stops[0].x, z: stops[0].z}, 0);
check(!document.querySelector('.city-guide-trigger').hidden, 'guide trigger visible');
check(!document.querySelector('.city-nearby').hidden, 'nearby prompt visible');
document.querySelector('.city-guide-trigger').click();
check(ui.isOpen(), 'guide opens');
check(document.querySelectorAll('.city-stop-item').length === 6, 'all six cards');
const largeMap = document.querySelector('.city-map');
const mapSvg = largeMap.querySelector('svg');
const stopsByZ = [...stops].sort((a, b) => a.z - b.z);
const stopsByX = [...stops].sort((a, b) => a.x - b.x);
check(Number(largeMap.querySelector(`.city-map-stop[data-stop="${stopsByZ.at(-1).id}"]`).dataset.mapY) <
  Number(largeMap.querySelector(`.city-map-stop[data-stop="${stopsByZ[0].id}"]`).dataset.mapY),
  'city map has its upright Z orientation');
check(Number(largeMap.querySelector(`.city-map-stop[data-stop="${stopsByX.at(-1).id}"]`).dataset.mapX) >
  Number(largeMap.querySelector(`.city-map-stop[data-stop="${stopsByX[0].id}"]`).dataset.mapX),
  'city map mirrors north/south while preserving east/west');
const miniCanvas = document.querySelector('.city-minimap-canvas');
const miniParts = miniCanvas.querySelector('svg').getAttribute('viewBox').split(' ').map(Number);
const miniRect = miniCanvas.getBoundingClientRect();
check(Math.abs(miniParts[2] / miniParts[3] - miniRect.width / miniRect.height) < .01,
  'minimap keeps the same X/Z proportions as the city');
const miniPlayer = miniCanvas.querySelector('.city-minimap-player');
check(Math.abs(Number(miniPlayer.dataset.mapY) -
  Number(largeMap.querySelector('.city-player-dot').dataset.mapY)) < .001,
  'minimap and guide put the player on the same side of the road');
const firstRadarView = miniCanvas.querySelector('svg').getAttribute('viewBox');
ui.update({x: stops[0].x + 100, z: stops[0].z + 50}, 0, Math.PI / 2);
const movedRadarView = miniCanvas.querySelector('svg').getAttribute('viewBox');
const [radarLeft, radarTop, radarWidth, radarHeight] = movedRadarView.split(' ').map(Number);
check(movedRadarView !== firstRadarView &&
  Math.abs(radarLeft + radarWidth / 2 - Number(miniPlayer.dataset.mapX)) < .001 &&
  Math.abs(radarTop + radarHeight / 2 - Number(miniPlayer.dataset.mapY)) < .001,
  'local radar follows the car at center');
check(miniCanvas.querySelector('.city-minimap-cone').style.getPropertyValue('--radar-heading') === '90deg' &&
  miniPlayer.style.getPropertyValue('--radar-heading') === '90deg',
  'radar vision cone and car heading turn together');
ui.update({x: stops[0].x, z: stops[0].z}, 0);
const fitView = mapSvg.getAttribute('viewBox');
const viewParts = () => mapSvg.getAttribute('viewBox').split(' ').map(Number);
const aspectMatches = () => {
  const [, , width, height] = viewParts();
  const rect = largeMap.getBoundingClientRect();
  return Math.abs(width / height - rect.width / rect.height) < .01;
};
const markerMatches = () => {
  const [left, top, width, height] = viewParts();
  const marker = largeMap.querySelector('.city-map-stop[data-stop="about"]');
  const mapRect = largeMap.getBoundingClientRect(), markerRect = marker.getBoundingClientRect();
  const expectedX = (Number(marker.dataset.mapX) - left) / width;
  const expectedY = (Number(marker.dataset.mapY) - top) / height;
  return Math.abs(parseFloat(marker.style.left) - expectedX * 100) < .01 &&
    Math.abs(parseFloat(marker.style.top) - expectedY * 100) < .01 &&
    (marker.hidden || (Math.abs(markerRect.left + markerRect.width / 2 - (mapRect.left + expectedX * mapRect.width)) < 3 &&
      Math.abs(markerRect.top + markerRect.height / 2 - (mapRect.top + expectedY * mapRect.height)) < 3));
};
check(aspectMatches(), 'map keeps geographic proportions');
check(markerMatches(), 'stop marker aligns with the map');
check(viewParts()[0] <= 0 && viewParts()[1] <= 0 &&
  viewParts()[0] + viewParts()[2] >= 100 && viewParts()[1] + viewParts()[3] >= 100,
  'fit includes the full city');
document.querySelector('.city-map-zoom-in').click();
const zoomView = mapSvg.getAttribute('viewBox');
check(zoomView !== fitView && viewParts()[2] < Number(fitView.split(' ')[2]), 'map zooms in');
check(aspectMatches() && markerMatches(), 'zoom preserves map and marker alignment');
largeMap.dispatchEvent(new KeyboardEvent('keydown', {key:'ArrowDown', bubbles:true}));
check(mapSvg.getAttribute('viewBox') !== zoomView, 'map pans with keyboard');
check(markerMatches(), 'pan preserves stop marker alignment');
const clickableStop = [...largeMap.querySelectorAll('.city-map-stop')].find(marker => {
  if (marker.hidden) return false;
  const rect = marker.getBoundingClientRect();
  return document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2) === marker;
});
check(!!clickableStop, 'a zoomed stop has a pointer hit target');
if (clickableStop) {
  clickableStop.click();
  check(document.querySelector('.city-story-content h3')?.textContent === DrivePortfolioUI.stories[clickableStop.dataset.stop].title,
    'zoomed map marker opens its story');
  document.querySelector('.city-back').click();
}
document.querySelector('.city-map-zoom-reset').click();
check(mapSvg.getAttribute('viewBox') === fitView, 'map fit restores full city');
largeMap.style.width = '75%';
window.dispatchEvent(new Event('resize'));
check(aspectMatches() && markerMatches(), 'resize refreshes map and marker positions');
largeMap.style.width = '';
window.dispatchEvent(new Event('resize'));
document.querySelector('.city-stop-item[data-stop="projects"]').click();
check(document.querySelector('.city-story-content h3')?.textContent === 'Things you can actually touch.', 'direct card opens story');
document.querySelector('.city-drive-here').click();
check(jumped === 'projects' && !ui.isOpen(), 'fast travel closes story');
ui.update({x: stops[0].x, z: stops[0].z}, 0);
document.dispatchEvent(new KeyboardEvent('keydown', {key: 'e', bubbles: true}));
check(ui.isOpen(), 'E opens nearby stop');
check(document.activeElement === document.querySelector('.city-panel'), 'E focuses the story panel, not a button');
document.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
check(!ui.isOpen(), 'Escape closes');
check(document.activeElement === document.querySelector('#drive-scene'), 'Escape returns focus to driving');
check(opens === closes && opens === 2, 'open and close callbacks');
document.querySelector('.city-guide-trigger').focus();
document.activeElement.dispatchEvent(new KeyboardEvent('keydown', {key:'e', bubbles:true}));
check(!ui.isOpen(), 'E does not activate a focused guide button');
document.querySelector('#drive-scene').focus();
const centerCity = {stops, bounds:{minX:-500,maxX:500,minZ:-500,maxZ:500},
  overviewRoads:[{x1:-400,z1:0,x2:400,z2:0,width:16}],
  manifest:{source:{cityName:'Test City'},centerCandidates:[{id:'center-0_0',x:0,z:0}]},
  snapToRoad(x,z){return {x:x+4,z,heading:0,distance:4,roadId:'street-1'};}};
ui.setCity(centerCity);
check(document.querySelectorAll('.city-center-item').length === 1, 'one road-safe city center');
check(document.querySelectorAll('.city-minimap-center').length === 1, 'minimap shows the center');
document.querySelector('.city-minimap').click();
check(ui.isOpen() && document.activeElement === document.querySelector('.city-panel'), 'minimap opens the guide and focuses panel');
document.querySelector('.city-center-item').click();
check(jumped === 'center-0_0' && !ui.isOpen(), 'center fast travel jumps and closes guide');
check(document.activeElement === document.querySelector('#drive-scene'), 'fast travel returns focus to the canvas');
const networkRoads = Array.from({length:2400}, (_, i) => ({
  x1:-400 + i % 80 * 10, z1:-400 + Math.floor(i / 80) * 20,
  x2:-390 + i % 80 * 10, z2:-390 + Math.floor(i / 80) * 20,
  roadClass:i % 8 === 0 ? 'highway' : i % 3 === 0 ? 'arterial' : 'street'
}));
ui.setCity({...centerCity, networkRoads});
const batchedPaths = [...document.querySelectorAll('.city-map svg path')];
check(batchedPaths.length <= 4 && document.querySelectorAll('.city-map svg line').length === 0,
  'large city network uses a few batched SVG paths');
check(batchedPaths.filter(path => !path.classList.contains('city-map-highway-glow'))
  .reduce((count, path) => count + Number(path.dataset.segments), 0) === networkRoads.length,
  'batched map keeps every source road segment');
const radarPaths = [...document.querySelectorAll('.city-minimap svg path')];
check(radarPaths.length <= 3 && radarPaths.reduce((count, path) => count + Number(path.dataset.segments), 0) > 0,
  'local radar batches nearby streets from the full road network');
document.querySelector('.city-guide-trigger').click();
document.querySelector('.city-map-zoom-in').click();
const panStart = performance.now();
for (let i = 0; i < 50; i++)
  largeMap.dispatchEvent(new KeyboardEvent('keydown', {key:'ArrowRight', bubbles:true}));
document.documentElement.dataset.panMs = (performance.now() - panStart).toFixed(1);
document.querySelector('.city-close').click();
ui.setCity(centerCity);
ui.setMap('course');
check(document.querySelector('.city-guide-trigger').hidden, 'guide hidden off city');
ui.setMap('city');
document.querySelector('#drive-scene').dispatchEvent(new KeyboardEvent('keydown', {key:'m', bubbles:true}));
check(ui.isOpen(), 'M opens city map');
document.dispatchEvent(new KeyboardEvent('keydown', {key:'m', bubbles:true}));
check(!ui.isOpen(), 'M closes city map');
document.getElementById('results').textContent = failures.length ? 'FAIL: ' + failures.join(', ') : 'PASS: guide, large zoomable map, pan, M hotkey, center fast travel, E prompt, Escape';
document.documentElement.dataset.result = failures.length ? 'fail' : 'pass';
if (new URLSearchParams(location.search).has('preview')) {
  if (new URLSearchParams(location.search).has('narrow')) {
    const overlay = document.querySelector('.city-overlay');
    overlay.style.width = '390px';
    overlay.style.right = 'auto';
  }
  ui.setMap('city');
  const story = new URLSearchParams(location.search).get('story');
  if (story) ui.open(story);
  else document.querySelector('.city-guide-trigger').click();
  const panel = document.querySelector('.city-panel').getBoundingClientRect();
  document.documentElement.dataset.layout = [window.innerWidth, Math.round(panel.left), Math.round(panel.right), document.documentElement.scrollWidth].join(':');
}
</script></body></html>
