<!doctype html><html><head><meta charset="utf-8"><title>City UI smoke test</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/portfolio.css"></head><body>
<canvas id="drive-scene" tabindex="0"></canvas><div class="route-picker"></div><pre id="results"></pre>
<script src="../js/city.js"></script><script src="../js/portfolio-ui.js"></script>
<script>
const failures = [];
function check(condition, label) { if (!condition) failures.push(label); }
const stops = DriveCity.stops;
let jumped = null, opens = 0, closes = 0;
const ui = DrivePortfolioUI.create({document, window, stops, driveTarget:document.querySelector('#drive-scene'),
  onJump(stop) { jumped = stop.id; }, onOpen() { opens++; }, onClose() { closes++; }});
ui.setMap('city');
ui.update({x: stops[0].x, z: stops[0].z}, 0);
check(!document.querySelector('.city-guide-trigger').hidden, 'guide trigger visible');
check(!document.querySelector('.city-nearby').hidden, 'nearby prompt visible');
document.querySelector('.city-guide-trigger').click();
check(ui.isOpen(), 'guide opens');
check(document.querySelectorAll('.city-stop-item').length === 6, 'all six cards');
document.querySelector('.city-stop-item[data-stop="projects"]').click();
check(document.querySelector('.city-story-content h3')?.textContent === 'Things you can actually touch.', 'direct card opens story');
document.querySelector('.city-drive-here').click();
check(jumped === 'projects' && !ui.isOpen(), 'fast travel closes story');
ui.update({x: stops[0].x, z: stops[0].z}, 0);
document.dispatchEvent(new KeyboardEvent('keydown', {key: 'e', bubbles: true}));
check(ui.isOpen(), 'E opens nearby stop');
check(document.activeElement === document.querySelector('.city-panel'), 'E focuses the story panel, not a button');
document.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
check(!ui.isOpen(), 'Escape closes');
check(document.activeElement === document.querySelector('#drive-scene'), 'Escape returns focus to driving');
check(opens === closes && opens === 2, 'open and close callbacks');
document.querySelector('.city-guide-trigger').focus();
document.activeElement.dispatchEvent(new KeyboardEvent('keydown', {key:'e', bubbles:true}));
check(!ui.isOpen(), 'E does not activate a focused guide button');
document.querySelector('#drive-scene').focus();
ui.setCity({stops, bounds:{minX:-500,maxX:500,minZ:-500,maxZ:500},
  overviewRoads:[{x1:-400,z1:0,x2:400,z2:0,width:16}],
  manifest:{source:{cityName:'Test City'},centerCandidates:[{id:'center-0_0',x:0,z:0}]},
  snapToRoad(x,z){return {x:x+4,z,heading:0,distance:4,roadId:'street-1'};}});
check(document.querySelectorAll('.city-center-item').length === 1, 'one road-safe city center');
check(document.querySelectorAll('.city-minimap-center').length === 1, 'minimap shows the center');
document.querySelector('.city-minimap').click();
check(ui.isOpen() && document.activeElement === document.querySelector('.city-panel'), 'minimap opens the guide and focuses panel');
document.querySelector('.city-center-item').click();
check(jumped === 'center-0_0' && !ui.isOpen(), 'center fast travel jumps and closes guide');
check(document.activeElement === document.querySelector('#drive-scene'), 'fast travel returns focus to the canvas');
ui.setMap('course');
check(document.querySelector('.city-guide-trigger').hidden, 'guide hidden off city');
document.getElementById('results').textContent = failures.length ? 'FAIL: ' + failures.join(', ') : 'PASS: guide, six cards, direct open, city minimap, center fast travel, E prompt, Escape, callbacks, map switch';
document.documentElement.dataset.result = failures.length ? 'fail' : 'pass';
if (new URLSearchParams(location.search).has('preview')) {
  if (new URLSearchParams(location.search).has('narrow')) {
    const overlay = document.querySelector('.city-overlay');
    overlay.style.width = '390px';
    overlay.style.right = 'auto';
  }
  ui.setMap('city');
  const story = new URLSearchParams(location.search).get('story');
  if (story) ui.open(story);
  else document.querySelector('.city-guide-trigger').click();
  const panel = document.querySelector('.city-panel').getBoundingClientRect();
  document.documentElement.dataset.layout = [window.innerWidth, Math.round(panel.left), Math.round(panel.right), document.documentElement.scrollWidth].join(':');
}
</script></body></html>
